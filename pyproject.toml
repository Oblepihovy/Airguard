[project]
name = "airguard"
version = "0.1.0"
description = "Airspace reroute simulation under threat"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# Пакета пока нет: модули лежат в src/ и rules/ и подключаются через pythonpath ниже.
# pip install ".[dev]" ставит только зависимости.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
packages = []

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]